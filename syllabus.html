<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Syllabus - Spidy Study" />
<title>Syllabus | Spidy Study</title>
<style>



/* =========================================================
   0. DESIGN TOKENS + RESET
   ========================================================= */
:root{
  --bg:            #05060f;
  --border:        rgba(255,255,255,.12);
  --text:          #eef2ff;
  --muted:         #8b93a7;
  --radius:        16px;
  --header-h:      64px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }

body{
  margin:0;
  min-height:100vh;
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(124,58,237,.22), transparent 60%),
    radial-gradient(900px 600px at 0% 110%, rgba(6,182,212,.18), transparent 60%),
    var(--bg);
  overflow-x:hidden;
  line-height:1.5;
}

a{ color:inherit; text-decoration:none; }

/* =========================================================
   1. ANIMATED GRADIENT MESH BACKGROUND
   ========================================================= */
.mesh{ position:fixed; inset:0; z-index:-2; overflow:hidden; pointer-events:none; }

.blob{
  position:absolute;
  width:46vw; height:46vw;
  min-width:300px; min-height:300px;
  border-radius:50%;
  filter:blur(75px);
  opacity:.45;
  mix-blend-mode:screen;
}
.blob--violet{ top:-12%; left:-10%;
  background:radial-gradient(circle at 35% 35%, #7c3aed, transparent 70%);
  animation:drift-a 26s ease-in-out infinite alternate; }
.blob--cyan{ top:10%; right:-15%;
  background:radial-gradient(circle at 50% 50%, #06b6d4, transparent 70%);
  animation:drift-b 32s ease-in-out infinite alternate; }
.blob--pink{ bottom:-18%; left:15%;
  background:radial-gradient(circle at 50% 50%, #ec4899, transparent 70%);
  animation:drift-c 28s ease-in-out infinite alternate; }
.blob--blue{ bottom:5%; right:5%;
  background:radial-gradient(circle at 50% 50%, #2563eb, transparent 70%);
  animation:drift-d 36s ease-in-out infinite alternate; }

@keyframes drift-a{ from{transform:translate3d(0,0,0) scale(1)}      to{transform:translate3d(14vw,10vh,0) scale(1.2)} }
@keyframes drift-b{ from{transform:translate3d(0,0,0) scale(1.05)}   to{transform:translate3d(-12vw,14vh,0) scale(.9)} }
@keyframes drift-c{ from{transform:translate3d(0,0,0) scale(.95)}    to{transform:translate3d(10vw,-12vh,0) scale(1.25)} }
@keyframes drift-d{ from{transform:translate3d(0,0,0) scale(1.1)}    to{transform:translate3d(-14vw,-8vh,0) scale(.95)} }

/* =========================================================
   2. GRID + DOT PATTERN OVERLAY
   ========================================================= */
.pattern{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:22px 22px, 88px 88px, 88px 88px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 35%, #000 25%, transparent 78%);
          mask-image:radial-gradient(ellipse at 50% 35%, #000 25%, transparent 78%);
}

/* =========================================================
   3. ENTRANCE ANIMATION
   ========================================================= */
@keyframes rise{
  from{ opacity:0; transform:translateY(26px); }
  to  { opacity:1; transform:translateY(0);    }
}

/* =========================================================
   4. HEADER (glass bar)
   ========================================================= */
.site-header{
  position:sticky; top:0; z-index:20;
  height:var(--header-h);
  padding:0 1.25rem;
  display:flex; align-items:center;
  background:rgba(10,12,24,.55);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
          backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--border);
}
.header-bar{
  width:min(1100px, 100%);
  margin-inline:auto;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:.5rem;
}
.back{
  justify-self:start;
  display:inline-flex; align-items:center; gap:.35rem;
  font-size:.85rem; font-weight:700;
  color:var(--muted);
  padding:.4rem .7rem;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  transition:color .25s, border-color .25s, box-shadow .25s, transform .25s;
}
.back:hover,.back:focus-visible{
  color:#22d3ee;
  border-color:rgba(34,211,238,.6);
  box-shadow:0 0 16px -4px rgba(34,211,238,.7);
  transform:translateY(-2px);
}
.brand{ display:flex; align-items:center; justify-content:center; gap:.6rem; }
.header-bar > .spacer{ justify-self:end; }

.spider{
  width:36px; height:36px;
  color:#22d3ee;
  filter:drop-shadow(0 0 5px rgba(34,211,238,.9)) drop-shadow(0 0 16px rgba(167,139,250,.6));
  animation:float 5s ease-in-out infinite;
}
@keyframes float{
  0%,100%{ transform:translateY(0) rotate(-3deg); }
  50%    { transform:translateY(-7px) rotate(3deg); }
}
.brand-name{
  font-size:1rem; font-weight:800; letter-spacing:.02em;
  text-shadow:0 0 18px rgba(167,139,250,.45);
}

/* =========================================================
   5. LAYOUT
   ========================================================= */
.container{ width:min(1100px, 100% - 2.5rem); margin-inline:auto; position:relative; z-index:1; }
main{ position:relative; z-index:1; }

/* =========================================================
   6. HERO
   ========================================================= */
.hero{
  text-align:center;
  padding:clamp(2.25rem, 7vw, 4rem) 0 clamp(1.25rem, 4vw, 2rem);
}
.hero h1{
  margin:0 auto; max-width:16ch;
  font-size:clamp(1.8rem, 6.5vw, 3.1rem);
  font-weight:800; line-height:1.12; letter-spacing:-.02em;
  background-image:linear-gradient(110deg,#a78bfa 0%,#22d3ee 45%,#f472b6 75%,#a78bfa 100%);
  background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  animation:rise .75s cubic-bezier(.22,.8,.28,1) .1s backwards,
            gradient-pan 9s linear infinite;
}
@keyframes gradient-pan{ from{background-position:0% 50%} to{background-position:200% 50%} }
.hero p{
  margin:.9rem 0 0;
  color:var(--muted);
  font-size:clamp(.8rem, 2.4vw, .98rem);
  font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  animation:rise .75s cubic-bezier(.22,.8,.28,1) .2s backwards;
}

/* =========================================================
   7. STICKY SEMESTER TABS
   ========================================================= */
.tabs-bar{
  position:sticky;
  top:var(--header-h);
  z-index:15;
  padding:.45rem 0;
}
/* floating rounded "black bar" — curved left/right ends instead of a rectangle */
.tabs{
  width:max-content;
  max-width:100%;
  margin-inline:auto;
  display:flex; flex-wrap:nowrap; gap:.5rem;
  overflow-x:auto;
  padding:.5rem .65rem;
  border:1px solid rgba(255,255,255,.09);
  border-radius:999px;
  background:rgba(8,10,20,.78);
  -webkit-backdrop-filter:blur(12px);
          backdrop-filter:blur(12px);
  box-shadow:0 14px 34px rgba(0,0,0,.5);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:0 0 auto;
  font-size:.82rem; font-weight:800; letter-spacing:.03em;
  padding:.42rem .85rem;
  border-radius:999px;
  color:var(--muted);
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  transition:transform .25s, color .25s, border-color .25s, box-shadow .25s, background .25s;
}
.tab:hover,.tab:focus-visible{
  color:var(--text);
  border-color:rgba(255,255,255,.35);
  transform:translateY(-2px);
}
/* CSS-only "active" tab when its section is the :target */
body:has(#sem1:target) .tab[href="#sem1"]{ background:rgb(167 139 250); color:#05060f; border-color:rgb(167 139 250); box-shadow:0 0 18px rgb(167 139 250 / .55); }
body:has(#sem2:target) .tab[href="#sem2"]{ background:rgb(34 211 238); color:#05060f; border-color:rgb(34 211 238); box-shadow:0 0 18px rgb(34 211 238 / .55); }
body:has(#sem3:target) .tab[href="#sem3"]{ background:rgb(244 114 182); color:#05060f; border-color:rgb(244 114 182); box-shadow:0 0 18px rgb(244 114 182 / .55); }
body:has(#sem4:target) .tab[href="#sem4"]{ background:rgb(163 230 53); color:#05060f; border-color:rgb(163 230 53); box-shadow:0 0 18px rgb(163 230 53 / .55); }
body:has(#sem5:target) .tab[href="#sem5"]{ background:rgb(251 191 36); color:#05060f; border-color:rgb(251 191 36); box-shadow:0 0 18px rgb(251 191 36 / .55); }
body:has(#sem6:target) .tab[href="#sem6"]{ background:rgb(251 146 60); color:#05060f; border-color:rgb(251 146 60); box-shadow:0 0 18px rgb(251 146 60 / .55); }
body:has(#sem7:target) .tab[href="#sem7"]{ background:rgb(96 165 250); color:#05060f; border-color:rgb(96 165 250); box-shadow:0 0 18px rgb(96 165 250 / .55); }
body:has(#sem8:target) .tab[href="#sem8"]{ background:rgb(45 212 191); color:#05060f; border-color:rgb(45 212 191); box-shadow:0 0 18px rgb(45 212 191 / .55); }

/* prompt shown only until a semester is picked */
.hint{
  display:none;
  margin:clamp(1.75rem, 5vw, 3rem) 0 4rem;
  padding:clamp(2rem, 7vw, 3.25rem) 1.25rem;
  text-align:center;
  color:var(--muted);
  font-size:clamp(.9rem, 3vw, 1.05rem);
  font-weight:600;
  letter-spacing:.02em;
  border:1px dashed rgba(255,255,255,.16);
  border-radius:24px;
  background:rgba(255,255,255,.03);
}
.hint strong{ display:block; color:var(--text); font-size:1.05rem; margin-bottom:.3rem; }
body:not(:has(.sem:target)) .hint{
  display:block;
  animation:rise .6s cubic-bezier(.22,.8,.28,1) .3s backwards;
}

/* =========================================================
   8. SEMESTER SECTIONS + SUBJECT CARDS
   ========================================================= */
.sem-list{
  display:flex;
  flex-direction:column;
  gap:clamp(1.25rem, 4vw, 2rem);
  padding:clamp(1.5rem, 5vw, 2.5rem) 0 1.25rem;
}

.sem{
  scroll-margin-top:calc(var(--header-h) + 72px);
  padding:clamp(1rem, 3vw, 1.6rem);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  -webkit-backdrop-filter:blur(10px);
          backdrop-filter:blur(10px);
  animation:rise .7s cubic-bezier(.22,.8,.28,1) calc(.3s + var(--i,1) * .06s) backwards;
  transition:border-color .35s ease, box-shadow .35s ease;
}

/* glow the section that was navigated to */
.sem:target{
  border-color:rgb(var(--accent) / .55);
  box-shadow:
    0 0 0 1px rgb(var(--accent) / .3),
    0 20px 45px rgba(0,0,0,.45),
    0 0 45px -14px rgb(var(--accent) / .8);
}

/* show ONLY the semester the user picked (older browsers fall back to all) */
body:has(.sem:target) .sem{ display:none; }
body:has(.sem:target) .sem:target{
  display:block;
  animation:rise .55s cubic-bezier(.22,.8,.28,1) .05s backwards;
}

.sem-head{
  display:flex; flex-wrap:wrap; align-items:center; gap:.7rem;
  margin-bottom:1.1rem;
}
.sem-head h2{
  margin:0;
  font-size:clamp(1.15rem, 4vw, 1.5rem);
  font-weight:800; letter-spacing:-.01em;
  color:rgb(var(--accent));
  text-shadow:0 0 22px rgb(var(--accent) / .55);
}
.sem:target .sem-head h2{ text-shadow:0 0 26px rgb(var(--accent) / .95); }
.sem-count{
  font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted);
  padding:.2rem .6rem;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
}

/* note + two-column result table */
.note{
  margin:0 0 1.35rem;
  padding:.85rem 1rem;
  font-size:.86rem; line-height:1.6;
  color:#fcd34d;
  background:rgba(253,224,71,.07);
  border:1px solid rgba(253,224,71,.3);
  border-radius:12px;
}
.res-title{
  margin:0 0 .3rem;
  font-size:clamp(1.15rem, 4vw, 1.5rem);
  font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
.res-branch{
  margin:0 0 1rem;
  color:var(--muted);
  font-size:.92rem; font-weight:600; letter-spacing:.04em;
}
.table-wrap{
  overflow-x:auto;
  border:1px solid var(--border);
  border-radius:14px;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  -webkit-backdrop-filter:blur(10px);
          backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(0,0,0,.3);
}
.res-table{
  width:100%;
  border-collapse:collapse;
  font-size:.92rem;
}
.res-table th{
  text-align:left;
  padding:.7rem .9rem;
  font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted);
  background:rgba(255,255,255,.05);
  border-bottom:1px solid var(--border);
}
.res-table td{
  padding:.62rem .9rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  line-height:1.55;
}
.res-table tbody tr:last-child td{ border-bottom:none; }
.res-table tbody tr:hover td{ background:rgba(255,255,255,.04); }
.res-table .tcode{
  width:1%; white-space:nowrap;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-weight:700; letter-spacing:.05em;
  color:#a78bfa;
}
.old{
  background:#fde047;
  color:#111;
  font-weight:700;
  padding:.06rem .34rem;
  border-radius:5px;
  box-decoration-break:clone;
  -webkit-box-decoration-break:clone;
}
/* year = paper button (black pill, white bold label, white border) */
.years{ display:flex; flex-wrap:wrap; gap:.45rem; }
.years a{
  display:inline-flex; align-items:center; justify-content:center;
  font-size:.72rem; font-weight:800; letter-spacing:.05em;
  line-height:1;
  padding:.5rem .78rem;
  color:#ffffff;
  background:#000000;
  border:1px solid #ffffff;
  border-radius:999px;
  box-shadow:
    0 8px 18px -12px rgba(255,255,255,.4),
    inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
}
.years a:hover,
.years a:focus-visible{
  transform:translateY(-3px) scale(1.07);
  filter:brightness(1.07) saturate(1.06);
  box-shadow:
    0 0 22px -4px rgba(255,255,255,.95),
    0 12px 24px -14px rgba(255,255,255,1),
    inset 0 1px 0 rgba(255,255,255,.55);
}
.years a:active{ transform:translateY(-1px) scale(1.02); }
.years a:focus-visible{
  outline:2px solid #ffffff;
  outline-offset:2px;
}

/* =========================================================
   9. BACK CTA + FOOTER
   ========================================================= */
.back-cta{
  display:inline-flex; align-items:center; gap:.55rem;
  width:max-content;
  margin:0 0 3rem;            /* sits at the left of the column, not centred */
  line-height:1;
  font-size:.9rem; font-weight:800;
  color:var(--text);
  padding:.75rem 1.4rem;
  border-radius:999px;
  border:1px solid transparent;
  background:
    linear-gradient(rgba(255,255,255,.07), rgba(255,255,255,.03)) padding-box,
    linear-gradient(120deg, rgba(167,139,250,.8), rgba(34,211,238,.7), rgba(244,114,182,.8)) border-box;
  transition:transform .3s, box-shadow .3s;
}
.ico{
  display:block; flex:none;      /* svg box centres optically with the label */
  width:15px; height:15px;
  color:currentColor;
  transform:translateY(-1px);    /* nudge icon onto the text's optical centre */
}
.back-cta:hover,.back-cta:focus-visible{
  transform:translateY(-3px);
  box-shadow:0 0 26px -6px rgba(167,139,250,.9);
}

.site-footer{
  position:relative; z-index:1;
  padding:1.5rem 1rem 2.25rem;
  text-align:center;
  color:var(--muted);
  font-size:.8rem; font-weight:700;
  letter-spacing:.28em; text-transform:uppercase;
  border-top:1px solid rgba(255,255,255,.06);
  animation:rise .7s cubic-bezier(.22,.8,.28,1) .8s backwards;
}
.footer-line{
  display:block; margin-top:.35rem;
  font-size:.95rem; letter-spacing:.34em;
  background:linear-gradient(90deg,#f472b6,#a78bfa,#22d3ee);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.heart{
  display:inline-block;
  color:#f472b6;
  text-shadow:0 0 10px rgba(244,114,182,.8);
  animation:beat 1.6s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{ transform:scale(1); }
  25%    { transform:scale(1.18); }
  40%    { transform:scale(1); }
  60%    { transform:scale(1.12); }
}

/* =========================================================
   10. RESPONSIVE (mobile-first)
   ========================================================= */
@media (min-width:600px){
  .tabs{ flex-wrap:wrap; justify-content:center; overflow:visible; }
}
@media (min-width:980px){
  .brand-name{ font-size:1.1rem; }
}

/* =========================================================
   11. REDUCED MOTION
   ========================================================= */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
  align-items: center;
  padding: 0.5rem 0 1.5rem;
}

  position: relative;

    branchSelect.addEventListener('change', () => {

      if (b) {
        semSelect.disabled = false;
      } else {
        semSelect.disabled = true;

    const BRANCH_LABEL = {
      'Computer Science & Engineering': 'Computer Science & Engg. (105)',

      'Electrical & Electronics Engineering': 'Electrical and Electronics Engg. (110)',

      'Mechanical Engineering': 'Mechanical Engg. (102)',

    function update() {
      const b = branchSelect.value;
      const s = semSelect.value;
      results.innerHTML = '';
      if (!b || !s) {
        results.classList.add('hidden');
        return;
      }
      const semNum = parseInt(s);
      const branchData = data[b];
      if (!branchData || !branchData[semNum]) {
        results.classList.add('hidden');
        return;
      }
      let html = '<p class="note">Note: Subject names ending with <span class="old">(OLD)</span> are highlighted in YELLOW (Before 2024 batch&#39;s subject name of that particular subject code).</p>';
      html += '<div class="res-title">SEMESTER - ' + s + '</div>';
      html += '<div class="res-branch">Branch: ' + esc(BRANCH_LABEL[b] || b) + '</div>';
      html += '<div class="table-wrap"><table class="res-table"><thead><tr><th>Code</th><th>Subject Name(s)</th></tr></thead><tbody>';
      branchData[semNum].forEach(e => {
        const segs = e.names.map(n =>
          n.endsWith('(OLD)') ? '<span class="old">' + esc(n) + '</span>' : esc(n)
        ).join(' / ');
        html += '<tr><td class="tcode">' + esc(e.code) + '</td><td>' + segs + '</td></tr>';
      });
      html += '</tbody></table></div>';
      results.innerHTML = html;
      results.classList.remove('hidden');
    }
